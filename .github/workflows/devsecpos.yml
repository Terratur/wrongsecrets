name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build + tests (sans dependency-check)
        run: ./mvnw clean verify -Ddependency-check.skip=true
  secret-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout avec historique complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-kind-cluster:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer le cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: wrongsecrets-cluster

      - name: Vérifier que le cluster répond
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A
  deploy-vault:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer le cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: wrongsecrets-cluster

      - name: Installer Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Ajouter le repo Helm HashiCorp
        run: |
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update

      - name: Installer Vault en mode dev + Agent Injector
        run: |
          helm install vault hashicorp/vault \
            --namespace vault --create-namespace \
            --set "server.dev.enabled=true" \
            --set "injector.enabled=true" \
            --wait --timeout 5m

      - name: Vérifier que Vault tourne
        run: |
          kubectl get pods -n vault
          kubectl exec -n vault vault-0 -- vault status